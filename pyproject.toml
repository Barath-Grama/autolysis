[project]
name = "autolysis"
version = "1.0.0"
description = "Intelligent, LLM-orchestrated CSV analysis engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.8,<3.13",
    "seaborn>=0.13,<0.15",
    "httpx>=0.27,<1",
    "rich>=13.7,<16",
    "markdown>=3.6,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "pytest-cov>=5.0,<8", "ruff>=0.16,<0.17"]

[project.scripts]
autolysis = "autolysis:main"

[tool.setuptools]
py-modules = ["autolysis"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["autolysis"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 110
target-version = "py311"

# Selected explicitly rather than inherited. Ruff's default rule set changes
# between releases, so leaving it implicit means a routine tool upgrade can
# turn a green build red without a line of project code changing.
[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "ISC", "BLE", "RUF"]
