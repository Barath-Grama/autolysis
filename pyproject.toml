[project]
name = "autolysis"
version = "1.0.0"
description = "Intelligent, LLM-orchestrated CSV analysis engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.8,<3.13",
    "seaborn>=0.13,<0.15",
    "httpx>=0.27,<1",
    "rich>=13.7,<16",
    "markdown>=3.6,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
autolysis = "autolysis:main"

[tool.setuptools]
py-modules = ["autolysis"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
